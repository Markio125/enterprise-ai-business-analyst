- id: EV12_expensive
  category: cost
  question: "Show hourly success rate for every merchant for the past year"
  user: u_exec
  expected:
    status: AWAITING_NARROWING
    narrowing_options_at_least: 2
    no_queries: true
  grading: [structural]

- id: EV13_null_keys
  category: data_quality
  question: "GMV by merchant segment for Oct 18-20"
  user: u_exec
  expected:
    status: ANSWERED
    breakdown_equals:
      truth: A5_null_merchant.eval_EV13_gmv_by_segment
      null_label: UNKNOWN
    required_caveats: [DQ02_NULL_KEYS]
    must_mention: ["unknown"]
    confidence: MEDIUM
  reference_sql: |
    SELECT COALESCE(m.segment, 'UNKNOWN'), SUM(a.amount_paise) FILTER (WHERE a.status = 'SUCCESS') / 100.0
    FROM v_attempts a LEFT JOIN dim_merchant m ON m.merchant_key = a.merchant_key
    WHERE a.date_key BETWEEN 20261018 AND 20261020 GROUP BY 1
  compare_step: breakdown
  null_label: UNKNOWN
  grading: [numeric, structural, sql_equivalence]

- id: EV14_acquirer
  category: analysis
  question: "Which acquirer had the worst card-not-present performance in late September and why?"
