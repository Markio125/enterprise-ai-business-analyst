    top_driver: {dimension: acquirer, segment: Acquirer Beta}
    must_mention: ["timeout", "acquirer beta"]
    grounded: true
  grading: [structural, llm_judge]

- id: EV15_followup_drilldown
  category: analysis
  conversation: ["Why did success rate drop in the last two weeks?", "Drill into UPI Collect by merchant"]
  user: u_exec
  clarification_answers: {METRIC_DEFINITION: a}
  expected:
    status: ANSWERED
    inherits_periods: true
    top_segment: {truth: A1_mix_shift.incremental_upi_collect_top_merchant.merchant_name}
  grading: [structural]

