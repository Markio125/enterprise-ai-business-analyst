- id: EV10_denominator
  category: ambiguity
  question: "What's our success rate?"
  user: u_exec
  expected:
    status: ANSWERED
    ambiguity_types_or_caveat: [METRIC_DEFINITION]
    disclosure_mentions: ["no period given"]
  grading: [structural]

- id: EV11_late_data
  category: data_quality
  question: "Did success rate drop yesterday?"
  user: u_exec
  clarification_answers: {METRIC_DEFINITION: a}
  expected:
    status: ANSWERED
    required_caveats: [LATE_ARRIVING]
