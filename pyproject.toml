[project]
name = "enterprise-ai-business-analyst"
version = "0.1.0"
description = "AI business analyst for payments data: safe text-to-SQL, mix-shift analysis, evidence-backed answers"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
