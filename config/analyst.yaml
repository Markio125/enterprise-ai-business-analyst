# Runtime settings for the analyst. Sections for the LLM, ambiguity handling and
# answers are added in later segments (see docs/SPEC.md section 3).

warehouse:
  engine: duckdb
  path: data/warehouse.duckdb
  read_only: true
  statement_timeout_ms: 10000
  memory_limit: 1GB
  threads: 4
  max_result_rows: 5000        # hard cap on rows returned to the app
  max_rows_to_llm: 200         # rows the LLM may see per result (used in segment 4)
  default_limit: 1000          # injected into non-aggregated queries without a LIMIT

cost_controls:
  max_scanned_rows_estimate: 50000000   # from DuckDB EXPLAIN (sum of table-scan estimates)
  max_intermediate_rows_estimate: 200000000   # largest operator estimate (catches join blow-ups)
  max_joins: 4
  forbid_cross_join: true
  max_time_window_days: 400
  # Large facts that need a time filter. Any predicate on one of the listed columns counts.
  require_time_filter_on:
    v_attempts: [date_key, created_at_utc]
    fact_payment_attempts_raw: [date_key, created_at_utc, ingested_at_utc]
    v_orders: [date_key, first_attempt_at_utc]
    fact_settlements: [settlement_date_key]
  on_exceed: ASK_TO_NARROW              # ASK_TO_NARROW | REJECT

sql_safety:
  # Table functions / scalar functions that touch files, the network, settings or the catalog.
  denied_functions: [read_csv, read_csv_auto, read_parquet, parquet_scan, read_json, read_json_auto,
                     read_json_objects, read_ndjson, read_ndjson_auto, read_text, read_blob, read_xlsx,
                     csv_scan, sniff_csv, glob, query, query_table, getenv, current_setting,
                     sqlite_scan, sqlite_attach, postgres_scan, postgres_attach, mysql_scan, iceberg_scan,
                     delta_scan, arrow_scan, httpfs, load_extension, duckdb_settings, duckdb_extensions,
                     duckdb_secrets, duckdb_databases, duckdb_tables, duckdb_columns, duckdb_views,
                     duckdb_functions, duckdb_dependencies, duckdb_temporary_files, which_secret,
                     pragma_version, pragma_database_size, pragma_table_info, pragma_storage_info,
                     pragma_show, pragma_metadata_info, test_all_types, range_files]
  # Tables an analyst query may never touch, whatever the role says (internal bookkeeping).
  internal_tables: [_data_versions]
  # Advisory: these tables have a cleaner curated view.
  prefer_views: {fact_payment_attempts_raw: v_attempts}

# --------------------------------------------------------------------------- segment 4: LLM pipeline
llm:
  # anthropic: Claude via the official SDK (needs ANTHROPIC_API_KEY or an `ant auth login` profile).
  # offline:   deterministic rule-based backend; no network, used by tests and when no key is set.
  # auto:      anthropic when credentials are present, otherwise offline.
  provider: auto
  model_reasoning: claude-opus-5-5      # SQL generation / repair
  model_fast: claude-haiku-5-5          # question parsing
  effort_reasoning: medium
  effort_fast: low
  max_tokens: 16000
  refusal_fallback: default             # server-side fallback on safety refusals (Opus only); null to disable
  max_json_retries: 2                   # malformed / semantically invalid LLM output -> retry with the error
  max_sql_repair_attempts: 2            # validator / executor error -> regenerate
  pricing:                              # USD per million tokens, used for the eval cost report
    claude-opus-5-5:  {input: 4.00, output: 20.00, cache_read: 0.20}
    claude-haiku-5-5: {input: 0.10, output: 0.50}   # prompts <= 100K tokens

defaults:
  default_time_window_days: 30          # used when a question names no period (always disclosed)
  default_comparison: previous_period
  min_segment_volume: 500
  top_n_drivers: 5
  max_queries_per_question: 20
  driver_dimensions: [payment_method, sub_method, issuer_bank, acquirer, merchant_segment, device_type, channel]

ambiguity:
  mode: ask_when_material               # always_ask | ask_when_material | assume_and_disclose
  # Ask when interpretations differ by more than this (relative %). Success-rate variants in
  # this dataset differ by ~6-7% (87.5% vs 93.2%), which is material for a payments business.
  material_threshold_pct: 5
  max_clarification_turns: 2

# --------------------------------------------------------------------------- segment 6: answers
answer:
  max_recommendations: 3
  max_grounding_retries: 2     # LLM rewrites with an untraceable number are re-requested, then the draft is used

# --------------------------------------------------------------------------- segment 7: API
api:
  metadata_db: data/app.sqlite     # sessions, questions, run_steps, queries, answers, audit, cache (SPEC 19)
  cache_ttl_seconds: 900           # query-result cache; the key includes the data version, so new data never hits
  workers: 4                       # concurrent pipeline runs (one at a time per session)
